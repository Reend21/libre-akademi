version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: libre-akademi-db
    restart: always
    environment:
      MYSQL_DATABASE: libre_akademi
      MYSQL_ROOT_PASSWORD: 21212121
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  server:
    build: ./server
    container_name: libre-akademi-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=21212121
      - DB_NAME=libre_akademi
      - CLIENT_URL=http://localhost:80
      - JWT_SECRET=supersecretjwtkey_libre_akademi
      - SYNC_DB=true
    depends_on:
      - db

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: libre-akademi-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_started

volumes:
  db_data:
